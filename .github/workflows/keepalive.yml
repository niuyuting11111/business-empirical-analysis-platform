name: Keep Streamlit App Alive

on:
  schedule:
    # 每 15 分钟访问一次，刷新休眠计时器，避免免费档隔夜 sleep 后冷启动失败
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app home (triggers real wake-up)
        run: |
          curl -fsS -m 40 --retry 3 "https://shizhengpai.streamlit.app/" || echo "home ping 失败(忽略，下次重试)"
      - name: Ping health endpoint
        run: |
          curl -fsS -m 20 --retry 3 "https://shizhengpai.streamlit.app/healthz" || echo "healthz ping 失败(忽略)"
